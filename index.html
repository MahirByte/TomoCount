<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>April 16 2026 Countdown for Releasing Tomodachi Life Living the dream</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #ffe7c7, #b8d9ff 60%, #7c91ff);
        color: #0f172a;
      }

      main {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 24px;
        padding: 48px 40px;
        max-width: 640px;
        text-align: center;
        box-shadow: 0 25px 45px rgba(15, 23, 42, 0.2);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(1.8rem, 3vw, 2.6rem);
      }

      p {
        margin: 8px 0;
        font-size: 1.1rem;
      }

      .countdown {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 16px;
        margin-top: 32px;
      }

      .unit {
        background: #0f172a;
        color: #f8fafc;
        padding: 20px 12px;
        border-radius: 18px;
      }

      .value {
        font-size: 2rem;
        font-weight: 700;
      }

      .label {
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.75;
      }

      .footer {
        margin-top: 28px;
        font-size: 0.95rem;
        color: #334155;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #e2e8f0;
        }

        main {
          background: rgba(15, 23, 42, 0.85);
        }

        .footer {
          color: #cbd5f5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>April 16 2026 Countdown</h1>
      <p>Releasing Tomodachi Life: Living the dream.</p>
      <p>Countdown to April 16, 2026 at 00:00 (local time).</p>

      <section class="countdown" aria-live="polite">
        <div class="unit">
          <div class="value" id="days">0</div>
          <div class="label">Days</div>
        </div>
        <div class="unit">
          <div class="value" id="hours">0</div>
          <div class="label">Hours</div>
        </div>
        <div class="unit">
          <div class="value" id="minutes">0</div>
          <div class="label">Minutes</div>
        </div>
        <div class="unit">
          <div class="value" id="seconds">0</div>
          <div class="label">Seconds</div>
        </div>
      </section>

      <p class="footer" id="status">Counting down...</p>
    </main>

    <script>
      const targetDate = new Date("2026-04-16T00:00:00");
      const units = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds"),
        status: document.getElementById("status"),
      };

      function updateCountdown() {
        const now = new Date();
        const difference = targetDate - now;

        if (difference <= 0) {
          units.days.textContent = "0";
          units.hours.textContent = "0";
          units.minutes.textContent = "0";
          units.seconds.textContent = "0";
          units.status.textContent = "It is release day!";
          return;
        }

        const totalSeconds = Math.floor(difference / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        units.days.textContent = days.toLocaleString();
        units.hours.textContent = String(hours).padStart(2, "0");
        units.minutes.textContent = String(minutes).padStart(2, "0");
        units.seconds.textContent = String(seconds).padStart(2, "0");
        units.status.textContent = "Counting down...";
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
